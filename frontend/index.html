<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monkey Mesh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f5f5f5; }
    #history { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { padding: 0.5rem 0.75rem; border-radius: 8px; max-width: 75%; white-space: pre-wrap; }
    .msg.user { background: #0070f3; color: #fff; align-self: flex-end; }
    .msg.assistant { background: #fff; border: 1px solid #ddd; align-self: flex-start; }
    .msg .meta { font-size: 0.7rem; opacity: 0.6; margin-top: 0.25rem; }
    #form { display: flex; gap: 0.5rem; padding: 1rem; background: #fff; border-top: 1px solid #ddd; }
    #input { flex: 1; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    #send { padding: 0.5rem 1rem; background: #0070f3; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="history"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const history = document.getElementById('history');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(role, text, meta) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      if (meta) {
        const small = document.createElement('div');
        small.className = 'meta';
        small.textContent = meta;
        div.appendChild(small);
      }
      history.appendChild(div);
      history.scrollTop = history.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage('user', message);
      input.value = '';
      send.disabled = true;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        addMessage('assistant', data.reply, `model: ${data.model_used}`);
      } catch (err) {
        addMessage('assistant', `Error: ${err.message}`);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
